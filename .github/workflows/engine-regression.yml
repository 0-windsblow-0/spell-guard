name: engine-regression

# Multi-version regression for the Spellguard engine.
# Currently narrow: the full suite must pass on every listed OS/version combo.
# The hook adapter is host-specific (Codex CLI) and not exercised here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (non-editable, real entry)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Run full suite (non-zero discovery required)
        run: |
          python - <<'PY'
          import unittest, sys
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_*.py")
          count = suite.countTestCases()
          assert count > 0, "no tests discovered"
          result = unittest.TextTestRunner(verbosity=0).run(suite)
          print("RAN", result.testsRun,
                "FAIL", len(result.failures), "ERR", len(result.errors))
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Doc checks
        run: python scripts/check_docs.py
